<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>NOCTURNE</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#080d19;--panel:#101a2b;--panel2:#121f33;--line:#263750;--muted:#91a4bf;--text:#edf5ff;--cyan:#61e7f5;--blue:#759bff;--violet:#b18cff;--green:#78e6b0;--amber:#ffc978}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#142747 0,transparent 38%),radial-gradient(ellipse at 90% 20%,#1d1740 0,transparent 30%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1160px;margin:auto;padding:32px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:13px}.logo{width:43px;height:43px;border:1px solid #4c7898;border-radius:14px;display:grid;place-items:center;color:var(--cyan);font-size:23px;background:#11263a;box-shadow:0 0 25px #4de5f322}.eyebrow,.mono{font-family:'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.eyebrow{font-size:10px;color:var(--cyan)}h1{font-size:19px;letter-spacing:.18em;margin:2px 0 0}.live{font:11px 'DM Mono';color:var(--green);border:1px solid #285b50;padding:9px 12px;border-radius:30px;background:#102a27}.live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 9px var(--green)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{background:linear-gradient(145deg,#142238ed,#0e1727f2);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 50px #0003}.hero-main{min-height:245px;position:relative;overflow:hidden}.hero-main:after{content:'☾';position:absolute;right:34px;bottom:-55px;font-size:210px;color:#7ca9ff0c;line-height:1}.kicker{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.hero h2{font-size:clamp(28px,4vw,42px);line-height:1.12;margin:14px 0 10px;max-width:500px}.hero h2 span{color:var(--cyan)}.sub{color:var(--muted);font-size:13px;line-height:1.7;max-width:490px}.clock{font:clamp(30px,5vw,48px) 'DM Mono';letter-spacing:-.06em;margin:17px 0 5px}.date{font-size:11px;color:var(--muted)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 13px}.section-title h3{font-size:13px;letter-spacing:.13em;text-transform:uppercase;margin:0}.section-title span{font:10px 'DM Mono';color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.target{position:relative;overflow:hidden}.target:before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--cyan)}.target.seven:before{background:var(--violet)}.target-head{display:flex;justify-content:space-between;align-items:center}.target-label{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.hours{font:38px 'DM Mono';margin:12px 0 2px}.hours small{font-size:13px;color:var(--muted)}.bedtime{font-size:25px;font-weight:800;margin:9px 0 3px}.target p{font-size:11px;color:var(--muted);margin:0}.pill{font:10px 'DM Mono';border:1px solid #34536a;border-radius:30px;padding:6px 9px;color:var(--cyan)}.seven .pill{color:var(--violet);border-color:#574276}.timeline{height:8px;border-radius:10px;background:#24334a;margin:19px 0 9px;overflow:hidden}.fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0}.seven .fill{background:linear-gradient(90deg,#8068d7,var(--violet))}.small-row{display:flex;justify-content:space-between;color:var(--muted);font:10px 'DM Mono'}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.field input,.field select{width:100%;background:#0a1423;border:1px solid #30445f;border-radius:11px;padding:13px;color:var(--text);font:14px 'DM Mono';outline:none}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #61e7f51a}.hint{font-size:10px;color:#8296b1;margin-top:7px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(100deg,#4bcddd,#729dff);color:#07121e;font-weight:800;font-family:Manrope;cursor:pointer}.btn.secondary{background:#1b2a40;color:#dceaff;border:1px solid #354b67}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:17px;background:#0b1524;border:1px solid #253850;border-radius:15px}.metric .num{font:25px 'DM Mono';margin:8px 0 4px}.metric .desc{font-size:10px;color:var(--muted)}
.log-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}.log{margin-top:14px}.entry{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:10px;padding:13px 4px;border-bottom:1px solid #22334a;font-size:12px;align-items:center}.entry span{color:var(--muted)}.delete{background:none;border:0;color:#ff8e9d;cursor:pointer;font-size:17px}.empty{color:var(--muted);font-size:12px;padding:20px 4px;text-align:center}
.note{border:1px solid #39405e;background:#171a30;border-radius:15px;padding:16px;color:#b7c3dc;font-size:11px;line-height:1.7;margin-top:18px}.note strong{color:var(--text)}footer{text-align:center;color:#637995;font:10px 'DM Mono';margin-top:30px;letter-spacing:.1em}
@media(max-width:760px){.hero{grid-template-columns:1fr}.grid,.controls{grid-template-columns:1fr}.log-form{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr 1fr}.panel{padding:19px}.entry{grid-template-columns:1fr 1fr auto}.entry span:nth-child(3){display:none}}

.auth-panel{margin-bottom:18px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px}.auth-panel input{width:100%;background:#0a1423;border:1px solid #30445f;border-radius:11px;padding:13px;color:var(--text);font:14px 'DM Mono';outline:none}.auth-panel input:focus{border-color:var(--cyan)}.remember-row{display:flex;align-items:flex-start;gap:10px;margin-top:13px;color:var(--text);font-size:12px;cursor:pointer}.remember-row input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--cyan)}.remember-row span{display:grid;gap:3px}.remember-row small{color:var(--muted);font-size:10px;line-height:1.5}.auth-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.auth-status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}.user-chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}.user-chip code{color:var(--cyan);overflow-wrap:anywhere}.sync{font:10px 'DM Mono';color:var(--green);letter-spacing:.08em}.hidden{display:none!important}
@media(max-width:760px){.auth-grid{grid-template-columns:1fr}}

.authbox{max-width:560px;margin:8vh auto}.field{margin:12px 0}.field input{width:100%;background:#0a1423;border:1px solid #30445f;border-radius:11px;padding:13px;color:var(--text);font:14px 'DM Mono'}.remember{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px;margin:14px 0}.status{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}.toplinks{display:flex;gap:12px;flex-wrap:wrap}.toplinks a{color:var(--cyan);font-size:12px} .adminrow{padding:14px 4px;border-bottom:1px solid #22334a;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">☾</div><div><div class="eyebrow">Personal sleep intelligence</div><h1>NOCTURNE</h1></div></div><div class="live">SYSTEM ONLINE</div></header><section class="panel authbox"><div class="kicker">SECURE ACCESS PORTAL</div><h2 style="margin:10px 0">Welcome to <span style="color:var(--cyan)">NOCTURNE.</span></h2><p class="sub">Sign in to open your personal sleep tracker or administrator console.</p><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><label class="remember"><input id="remember" type="checkbox" checked> Remember me on this device</label><div class="actions"><button class="btn" id="signin">Sign in</button><button class="btn secondary" id="signup">Create account</button></div><div class="status" id="status">Use your Supabase account credentials. Admin access is assigned separately by the project owner.</div></section><footer>NOCTURNE // SECURE ACCESS</footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://dehuhtnbjafzqdwfodgm.supabase.co'; const SUPABASE_ANON_KEY='sb_publishable_KnfxP9_I0t2tDlOSVzpypQ_FTYtsKss';
const $=id=>document.getElementById(id); const configured=()=>SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes('YOUR_');
const remember=localStorage.getItem('nocturne-remember')!=='false';
const storage=remember?localStorage:sessionStorage;
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const deviceKey='nocturne-device-id'; let deviceId=localStorage.getItem(deviceKey); if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem(deviceKey,deviceId)}
async function roleOf(user){const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;return !!data;}

const status=$('status'); if(!configured())status.textContent='Setup required: add your Supabase Project URL and publishable key in login.html, index.html and admin.html.';
$('remember').checked=remember;
$('signin').onclick=async()=>{if(!configured())return status.textContent='Configure Supabase credentials first.';localStorage.setItem('nocturne-remember',$('remember').checked?'true':'false');const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:$('remember').checked?localStorage:sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return status.textContent=error.message;try{const {data:role,error:roleError}=await client.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(roleError)throw roleError;location.href=role?'admin.html':'index.html'}catch(e){status.textContent='Could not verify account role: '+e.message}};
$('signup').onclick=async()=>{if(!configured())return status.textContent='Configure Supabase credentials first.';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data,error}=await client.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+location.pathname}});status.textContent=error?error.message:(data.session?'Account created. Please sign in.':'Account created. Check your email to confirm, then sign in.')};
if(configured()&&db){db.auth.getSession().then(async({data})=>{if(data.session){try{location.href=await roleOf(data.session.user)?'admin.html':'index.html'}catch(e){status.textContent=e.message}}})}
</script></body></html>
